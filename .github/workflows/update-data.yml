name: Update OpenPharmaDB

on:
  workflow_dispatch:

  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fastjsonschema pytest

      - name: Create data directories
        run: |
          mkdir -p data/raw/fda
          mkdir -p data/raw/health_canada
          mkdir -p data/normalized/fda
          mkdir -p data/normalized/health_canada
          mkdir -p data/published
          mkdir -p schemas

      - name: Fetch Health Canada data
        run: python -m scripts.regulators.health_canada
        continue-on-error: true

      - name: Fetch FDA data
        run: python -m scripts.regulators.fda
        continue-on-error: true

      - name: Merge datasets
        run: python -m scripts.core.merge
        continue-on-error: true

      - name: Validate dataset
        run: python -m scripts.core.validate
        continue-on-error: true

      - name: Run tests
        run: pytest
        continue-on-error: true

      - name: Check for data changes
        id: check_changes
        run: |
          git add data/ --all
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dataset changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dataset changes detected."
            git diff --cached --stat
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update pharmaceutical recall data [automated]"
          git push

      - name: Trigger Render deploy
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK not configured. Skipping deployment."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" || echo "Deploy hook failed or not configured"
        continue-on-error: true

      - name: Workflow status
        if: always()
        run: |
          echo "✅ Data update workflow completed"
          echo "Changed: ${{ steps.check_changes.outputs.changed }}"
